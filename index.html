<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲互動螢幕</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; transition: background 0.3s; }
        .container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; }
        button { padding: 20px 40px; font-size: 24px; margin: 15px; border: none; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; width: 200px; }
        .btn-red { background-color: #ff3333; }
        .btn-green { background-color: #2ecc71; }
        .back-btn { display: none; position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.5); padding: 10px 20px; font-size: 16px; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container" id="menu">
        <h2>請選擇你的顏色</h2>
        <button class="btn-red" onclick="changeColor('#ff3333')">🔴 紅色</button>
        <button class="btn-green" onclick="changeColor('#2ecc71')">🟢 綠色</button>
    </div>
    
    <button class="back-btn" id="backBtn" onclick="resetMenu()">返回</button>

    <script>
        function changeColor(color) {
            document.body.style.backgroundColor = color;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('backBtn').style.display = 'block';
        }
        function resetMenu() {
            document.body.style.backgroundColor = '#ffffff';
            document.getElementById('menu').style.display = 'flex';
            document.getElementById('backBtn').style.display = 'none';
        }
    </script>
</body>
</html>
